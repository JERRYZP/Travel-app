<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>票务看板型首页 Demo · 游北京</title>
<style>
  :root {
    --bg: #f7f1e6;
    --bg-soft: #fbf7ef;
    --card: #fffdf8;
    --ink: #33291f;
    --ink-2: #7a6c5a;
    --ink-3: #a89882;
    --brand: #b8432a;
    --brand-deep: #96331f;
    --brand-tint: #f6e3dc;
    --gold: #a97b2f;
    --gold-tint: #f3e9d2;
    --ok: #3e7d4f;
    --ok-tint: #e3efe2;
    --warn: #b06a1e;
    --warn-tint: #f7ecd7;
    --muted-tint: #efe8da;
    --line: #e9dfcd;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(120, 90, 50, .07);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #ece4d4;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 24px 0;
  }
  .phone {
    width: 402px;
    height: 874px;
    background: var(--bg);
    border-radius: 36px;
    box-shadow: 0 20px 60px rgba(80, 60, 30, .25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* 顶部导航 */
  .navbar {
    padding: 54px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background:
      radial-gradient(420px 200px at 88% -40%, rgba(169, 123, 47, .18), transparent 70%),
      linear-gradient(var(--bg-soft), var(--bg));
    flex-shrink: 0;
  }
  .navbar .city {
    font-size: 13px;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 4px;
    font-weight: 600;
  }
  .navbar .title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .navbar .capsule {
    width: 74px; height: 28px;
    border: 1px solid rgba(0,0,0,.08);
    border-radius: 14px;
    background: rgba(255,255,255,.7);
    display: flex; align-items: center; justify-content: center; gap: 14px;
    color: var(--ink-2); font-size: 12px;
  }
  .scroll { flex: 1; overflow-y: auto; padding: 4px 16px 96px; }
  .scroll::-webkit-scrollbar { display: none; }

  /* 行程头卡 */
  .trip-head {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
    color: #fdf6ee;
    border-radius: 20px;
    padding: 18px 18px 16px;
    box-shadow: 0 8px 22px rgba(150, 51, 31, .28);
  }
  .trip-head .label { font-size: 12px; opacity: .85; letter-spacing: 2px; }
  .trip-head h1 { font-size: 22px; font-weight: 800; margin: 6px 0 2px; }
  .trip-head .dates { font-size: 13px; opacity: .9; }
  .trip-progress { margin-top: 14px; }
  .trip-progress .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; opacity: .95; margin-bottom: 6px;
  }
  .trip-progress .row b { font-size: 14px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: #f5d9a8; transition: width .5s cubic-bezier(.22,1,.36,1); }
  .trip-head .days { display: flex; gap: 6px; margin-top: 12px; }
  .trip-head .days span {
    font-size: 11px; padding: 3px 9px; border-radius: 10px;
    background: rgba(255,255,255,.14);
  }
  .trip-head .days span.hot { background: rgba(245, 217, 168, .95); color: var(--brand-deep); font-weight: 700; }

  /* 分组日期标题 */
  .day-title {
    display: flex; align-items: center; gap: 8px;
    margin: 20px 2px 10px;
    font-size: 14px; font-weight: 700;
  }
  .day-title .chip {
    font-size: 11px; font-weight: 600; color: var(--gold);
    background: var(--gold-tint); border-radius: 8px; padding: 2px 8px;
  }
  .day-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* 票务行 */
  .spot-row {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .spot-row .main {
    display: flex; gap: 12px; padding: 12px; align-items: center;
    cursor: pointer;
  }
  .spot-row .thumb {
    width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex-shrink: 0;
    background: var(--muted-tint);
  }
  .spot-row .info { flex: 1; min-width: 0; }
  .spot-row .name { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .spot-row .name .arrow { color: var(--ink-3); font-weight: 400; font-size: 13px; }
  .spot-row .sub { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
  .spot-row .sub b { color: var(--warn); font-weight: 600; }

  .pill {
    font-size: 11px; font-weight: 600; border-radius: 8px; padding: 3px 8px; white-space: nowrap;
  }
  .pill.ok    { background: var(--ok-tint); color: var(--ok); }
  .pill.warn  { background: var(--warn-tint); color: var(--warn); }
  .pill.brand { background: var(--brand-tint); color: var(--brand); }
  .pill.muted { background: var(--muted-tint); color: var(--ink-2); }

  /* 提醒触达后的轻气泡 */
  .bubble {
    margin: 0 12px 12px;
    background: var(--brand-tint);
    border-radius: 12px;
    padding: 10px 12px;
    position: relative;
    animation: rise .35s cubic-bezier(.22,1,.36,1);
  }
  .bubble::before {
    content: "";
    position: absolute; top: -5px; left: 28px;
    width: 10px; height: 10px; background: var(--brand-tint);
    transform: rotate(45deg); border-radius: 2px;
  }
  .bubble .q { font-size: 13px; font-weight: 600; color: var(--brand-deep); }
  .bubble .hint { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
  .bubble .acts { display: flex; gap: 8px; margin-top: 8px; }
  .bubble button {
    flex: 1; border: none; border-radius: 9px; padding: 7px 0;
    font-size: 12px; font-weight: 700; cursor: pointer;
    transition: transform .12s ease-out, opacity .12s ease-out;
    font-family: inherit;
  }
  .bubble button:active { transform: scale(.96); opacity: .85; }
  .bubble .yes { background: var(--brand); color: #fdf6ee; }
  .bubble .no  { background: #ffffffcc; color: var(--brand); }
  .bubble .skip { flex: 0 0 auto; background: transparent; color: var(--ink-3); font-weight: 500; }
  @keyframes rise { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  /* 收起态小提示点 */
  .bubble-dot {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--ink-3);
    margin: 0 12px 12px; cursor: pointer;
  }
  .bubble-dot i { width: 6px; height: 6px; border-radius: 3px; background: var(--brand); display: inline-block; }

  /* toast */
  .toast {
    position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%) translateY(8px);
    background: rgba(51, 41, 31, .92); color: #fbf7ef;
    font-size: 13px; padding: 9px 18px; border-radius: 20px;
    opacity: 0; pointer-events: none; transition: all .25s cubic-bezier(.22,1,.36,1);
    z-index: 50; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* 添加提醒入口 */
  .add-entry {
    margin: 18px 2px 0;
    border: 1.5px dashed #d9c9ab;
    border-radius: 14px;
    background: rgba(255, 253, 248, .6);
    color: var(--brand);
    font-size: 14px; font-weight: 600;
    padding: 13px 0; width: 100%;
    cursor: pointer; font-family: inherit;
    transition: background .15s ease-out;
  }
  .add-entry:hover { background: #fffdf8; }
  .foot-note {
    text-align: center; font-size: 11px; color: var(--ink-3); margin-top: 12px;
  }

  /* 底部 tabbar */
  .tabbar {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(255, 253, 248, .96);
    border-top: 1px solid var(--line);
    display: flex; padding: 10px 0 26px;
  }
  .tabbar .tab {
    flex: 1; text-align: center; font-size: 11px; color: var(--ink-3);
    cursor: pointer;
  }
  .tabbar .tab .ic { font-size: 20px; display: block; margin-bottom: 2px; }
  .tabbar .tab.active { color: var(--brand); font-weight: 700; }
  .tabbar .tab .badge {
    display: inline-block; min-width: 15px; height: 15px; border-radius: 8px;
    background: var(--brand); color: #fff; font-size: 9px; line-height: 15px;
    padding: 0 4px; margin-left: 2px; vertical-align: top;
  }

  /* 添加提醒弹层 */
  .mask {
    position: absolute; inset: 0; background: rgba(40, 30, 18, .45);
    opacity: 0; pointer-events: none; transition: opacity .25s ease-out; z-index: 40;
    display: flex; align-items: flex-end;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%; background: var(--bg-soft);
    border-radius: 22px 22px 0 0; padding: 20px 20px 40px;
    transform: translateY(100%); transition: transform .3s cubic-bezier(.22,1,.36,1);
  }
  .mask.show .sheet { transform: none; }
  .sheet h3 { font-size: 16px; margin-bottom: 14px; }
  .sheet .field { margin-bottom: 12px; }
  .sheet .field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  .sheet .fake-input {
    background: var(--card); border-radius: 12px; padding: 12px 14px; font-size: 14px;
    color: var(--ink); display: flex; justify-content: space-between; align-items: center;
  }
  .sheet .fake-input .ph { color: var(--ink-3); }
  .sheet .submit {
    width: 100%; border: none; border-radius: 22px; background: var(--brand);
    color: #fdf6ee; font-size: 15px; font-weight: 700; padding: 13px 0;
    margin-top: 8px; cursor: pointer; font-family: inherit;
  }
  .sheet .tip { font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 10px; }

  /* 演示控制条 */
  .demo-bar {
    position: fixed; top: 12px; right: 14px; z-index: 99;
    font-size: 11px; color: #6b5c48; background: rgba(255,255,255,.85);
    border-radius: 12px; padding: 8px 12px; box-shadow: 0 4px 14px rgba(80,60,30,.15);
    line-height: 1.9;
  }
</style>
</head>
<body>

<div class="demo-bar">
  🎫 票务看板首页 Demo<br>
  试试：点气泡按钮 · 点「+ 添加提醒」
</div>

<div class="phone">
  <div class="navbar">
    <div class="city">📍 游北京</div>
    <div class="title">我的行程</div>
    <div class="capsule"><span>•••</span><span>◉</span></div>
  </div>

  <div class="scroll" id="scroll"></div>

  <div class="toast" id="toast"></div>

  <div class="tabbar">
    <div class="tab active"><span class="ic">🗓</span>行程</div>
    <div class="tab" onclick="toast('Demo：跳转「我的」')"><span class="ic">👤</span>我的</div>
  </div>

  <div class="mask" id="mask">
    <div class="sheet">
      <h3>添加提醒</h3>
      <div class="field">
        <label>什么时间到北京？</label>
        <div class="fake-input"><span>10月3日 ~ 10月5日</span><span>📅</span></div>
      </div>
      <div class="field">
        <label>想约哪个景点？</label>
        <div class="fake-input"><span>天安门城楼</span><span>▾</span></div>
      </div>
      <div class="field">
        <label>提醒时间</label>
        <div class="fake-input"><span>放票前 5 分钟</span><span>🔔</span></div>
      </div>
      <button class="submit" onclick="submitAdd()">✓ 提交</button>
      <div class="tip">无需先建行程，提交后自动加入你的北京行程</div>
    </div>
  </div>
</div>

<script>
const IMG = "../../miniprogram/images/spots/";
// status: ok=抢到了 / warn=待抢(提醒已设) / brand=未开抢(已设提醒) / none=没约到 / free=免预约
let state = [
  { day: "10月2日 · 周五", dateTag: "第 1 天", items: [
    { id: "gugong",  name: "故宫博物院", img: "gugong.jpg",  status: "brand", sub: '10月3日 20:00 放票 · <b>提前7天</b>', pill: ["未开抢","brand"], bubble: null },
    { id: "guobo",   name: "国家博物馆", img: "guobo.jpg",   status: "warn",  sub: '10月3日 17:00 放票 · <b>已设提醒</b>', pill: ["待抢","warn"], bubble: { q: "国博的票，抢到了吗？", hint: "刚提醒过你 · 不用也可以忽略" } },
    { id: "tiantan", name: "天坛公园",   img: "tiantan.jpg", status: "free",  sub: "无需预约 · 随到随玩", pill: ["随到随玩","muted"], bubble: null },
  ]},
  { day: "10月3日 · 周六", dateTag: "第 2 天", items: [
    { id: "tsinghua", name: "清华大学",     img: "tsinghua.jpg", status: "ok",   sub: "10月4日 09:00 入校 · 已约", pill: ["抢到了","ok"], bubble: null },
    { id: "badaling", name: "八达岭长城",   img: "badaling.jpg", status: "none", sub: "没抢到 10月4日 的票 · 可再设提醒", pill: ["没约到","muted"], bubble: null },
    { id: "beihai",   name: "北海公园",     img: "beihai.jpg",   status: "free", sub: "无需预约 · 随到随玩", pill: ["随到随玩","muted"], bubble: null },
  ]},
];

function pillHtml(p) { return `<span class="pill ${p[1]}">${p[0]}</span>`; }

function render() {
  const total = state.flatMap(d => d.items).filter(i => i.status !== "free").length;
  const done  = state.flatMap(d => d.items).filter(i => i.status === "ok").length;
  const pct = total ? Math.round(done / total * 100) : 0;

  let html = `
  <div class="trip-head">
    <div class="label">BEIJING TRIP</div>
    <h1>国庆北京之行</h1>
    <div class="dates">10月2日 ~ 10月4日 · 还有 27 天</div>
    <div class="trip-progress">
      <div class="row"><span>门票搞定</span><b>${done} / ${total}</b></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div class="days"><span class="hot">10月3日 20:00 故宫放票</span><span>10月3日 17:00 国博放票</span></div>
  </div>`;

  state.forEach((d, di) => {
    html += `<div class="day-title">${d.day}<span class="chip">${d.dateTag}</span></div>`;
    d.items.forEach((it, ii) => {
      html += `
      <div class="spot-row">
        <div class="main" onclick="toast('Demo：查看 ${it.name} 预约规则')">
          <img class="thumb" src="${IMG}${it.img}" alt="">
          <div class="info">
            <div class="name">${it.name} <span class="arrow">›</span></div>
            <div class="sub">${it.sub}</div>
          </div>
          ${pillHtml(it.pill)}
        </div>`;
      if (it.bubble) {
        html += `
        <div class="bubble">
          <div class="q">${it.bubble.q}</div>
          <div class="hint">${it.bubble.hint}</div>
          <div class="acts">
            <button class="yes" onclick="answer(${di},${ii},'ok')">抢到了</button>
            <button class="no" onclick="answer(${di},${ii},'none')">还没抢到</button>
            <button class="skip" onclick="answer(${di},${ii},'skip')">忽略</button>
          </div>
        </div>`;
      } else if (it.status === "brand") {
        html += `<div class="bubble-dot" onclick="showBubble(${di},${ii})"><i></i>到点提醒你抢票</div>`;
      }
      html += `</div>`;
    });
  });

  html += `
  <button class="add-entry" onclick="openSheet()">＋ 添加提醒</button>
  <div class="foot-note">只想去个别景点？直接添加提醒，行程自动帮你安排</div>`;
  document.getElementById("scroll").innerHTML = html;
}

function answer(di, ii, choice) {
  const it = state[di].items[ii];
  if (choice === "ok") {
    it.pill = ["抢到了", "ok"]; it.status = "ok"; it.bubble = null;
    toast("👍 已标记抢到，行程不用再操心");
  } else if (choice === "none") {
    it.pill = ["没约到", "muted"]; it.status = "none"; it.bubble = null;
    toast("别急，可以再设下一轮放票提醒");
  } else {
    it.bubble = null;
    toast("已收起，随时在行程里查看票务状态");
  }
  render();
}

function showBubble(di, ii) {
  const it = state[di].items[ii];
  it.bubble = { q: `${it.name}的票，抢到了吗？`, hint: "告诉我们一声，行程状态就更新了" };
  render();
}

function openSheet() { document.getElementById("mask").classList.add("show"); }
function submitAdd() {
  document.getElementById("mask").classList.remove("show");
  toast("✓ 提醒已设，已加入 10月3日 行程");
  // 演示：把八达岭那行换成新加的天安门城楼
  state[1].items[1] = { id: "chenglou", name: "天安门城楼", img: "tiananmen-chenglou.jpg",
    status: "brand", sub: "10月4日 20:00 放票 · <b>已设提醒</b>", pill: ["未开抢","brand"], bubble: null };
  render();
}
document.getElementById("mask").addEventListener("click", e => {
  if (e.target.id === "mask") e.target.classList.remove("show");
});

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

render();
</script>
</body>
</html>
